name: CPAN release installability audit (0.03)

on:
  push:
    branches:
      - release/0.03-readiness
  workflow_dispatch:

jobs:
  published-cpan:
    # Run only when HTTP1 0.13, HTTP2 0.13 and HTTP3 0.14 have
    # actually been published and indexed on CPAN; source CI is separate.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential pkg-config libssl-dev openssl zlib1g-dev libnghttp2-dev
      - name: Install required HTTP1-only dependencies from CPAN
        run: |
          sudo cpanm --notest --quiet 'Uniform::HTTP@0.06' 'Unblock::HTTP1@0.13'
          sudo cpanm --notest --quiet URI Test::More CPAN::Meta
          perl -MUnblock::HTTP1 -MUniform::HTTP -e '
            die "HTTP1 too old" unless $Unblock::HTTP1::VERSION >= 0.13;
            die "Uniform too old" unless $Uniform::HTTP::VERSION >= 0.06;'
      - name: Verify HTTP1-only application without optional engines
        run: |
          perl Makefile.PL
          make
          prove -bl t/39-http1-only.t
          perl -Ilib -MUnblock::HTTP -MUnblock::HTTP::Client -MUnblock::HTTP::Server -MUnblock::HTTP::Integration -e '
            die "Wrong Unblock::HTTP version" unless $Unblock::HTTP::VERSION eq "0.03";'
      - name: Install optional published protocol engines and WebSocket
        run: |
          sudo cpanm --notest --quiet 'Alien::nghttp2@0.003'
          sudo cpanm --notest --quiet 'Alien::ngtcp2@0.03' 'Alien::nghttp3@0.01'
          sudo cpanm --notest --quiet 'Net::QUIC@0.06'
          sudo cpanm --notest --quiet 'Unblock::HTTP2@0.13' 'Unblock::HTTP3@0.14'
          sudo cpanm --notest --quiet 'Unblock::WebSocket@0.02'
      - name: Verify published dependency versions
        run: |
          perl -MNet::QUIC -MUnblock::HTTP1 -MUnblock::HTTP2 -MUnblock::HTTP3 -MUnblock::WebSocket -MUniform::HTTP -e '
            for my $p (
              ["Net::QUIC", $Net::QUIC::VERSION, 0.06],
              ["Unblock::HTTP1", $Unblock::HTTP1::VERSION, 0.13],
              ["Unblock::HTTP2", $Unblock::HTTP2::VERSION, 0.13],
              ["Unblock::HTTP3", $Unblock::HTTP3::VERSION, 0.14],
              ["Unblock::WebSocket", $Unblock::WebSocket::VERSION, 0.02],
              ["Uniform::HTTP", $Uniform::HTTP::VERSION, 0.06],
            ) {
              die "$p->[0] version $p->[1] below required $p->[2]\n"
                unless $p->[1] >= $p->[2];
              print "$p->[0]: $p->[1]\n";
            }'
      - name: Distribution tests against published CPAN dependencies
        run: |
          perl Makefile.PL
          make
          make test
          make distcheck
          make disttest
      - name: Audit tarball and PAUSE indexing metadata
        run: |
          make distmeta
          make distdir
          distdir=$(find . -maxdepth 1 -type d -name 'Unblock-HTTP-0.03' -print -quit)
          test -n "$distdir"
          test -f "$distdir/lib/Unblock/HTTP/_WebSocketH2Body.pm"
          test -f "$distdir/t/37-client-h3-websocket-admission.t"
          test -f "$distdir/docs/RELEASE-0.03.md"
          test ! -d "$distdir/xt"
          test ! -d "$distdir/bench"
          test ! -d "$distdir/.github"
          test ! -e "$distdir/Handoff.md"
          test ! -e "$distdir/docs/RELEASE-COORDINATION.md"
          test ! -e "$distdir/lib/Unblock/HTTP/Adapter/LinuxEvent.pm"
          ! grep -E "['\"]Linux::Event['\"] *=>" "$distdir/Makefile.PL"
          perl -MJSON::PP -e '
            open my $fh, "<", "Unblock-HTTP-0.03/META.json" or die $!;
            local $/;
            my $meta = decode_json(<$fh>);
            die "wrong release version" unless $meta->{version} eq "0.03";
            my %excluded = map { $_ => 1 } @{$meta->{no_index}{package} || []};
            for my $name (qw(
                Unblock::HTTP::_AltSvc
                Unblock::HTTP::_ClientOperation
                Unblock::HTTP::_EngineFactory
                Unblock::HTTP::_Policy
                Unblock::HTTP::_Session
                Unblock::HTTP::_WebSocketH2Body
            )) {
                die "private package indexed: $name" unless $excluded{$name};
            }
          '
