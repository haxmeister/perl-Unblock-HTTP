name: Linux::Event integration

on:
  push:
    branches:
      - feature/high-level-client-server
      - main
  pull_request:
  workflow_dispatch:

jobs:
  real-sockets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus build-essential pkg-config libssl-dev openssl zlib1g-dev libnghttp2-dev
      - name: Install protocol engines and Linux::Event
        run: |
          trap 'sudo tail -n 100 /root/.cpanm/build.log' ERR
          sudo cpanm --notest --quiet Linux::Event@0.117
          sudo cpanm --notest --quiet Uniform::HTTP@0.06 Alien::nghttp2@0.003
          sudo cpanm --notest --quiet Alien::ngtcp2@0.03 Alien::nghttp3@0.01
          mkdir -p /tmp/unblock-sources
          # Pin the coordinated receive/lifecycle engine commits. Publish these
          # feature commits before this upper branch; never silently test main.
          for spec in \
            perl-Net-QUIC:566366819b21c30e449bf13f55ec1d6ebfc5de64 \
            perl-Unblock-HTTP1:783e2a951dafac2756ba2c3cf34ea35fc043de6f \
            perl-Unblock-HTTP2:90639bf52394098296be4115e5485606ba6d7f92 \
            perl-Unblock-HTTP3:e6c1cbb0e54b0dbe40ed6d29e5884e50983a3319; do
            project=${spec%%:*}
            revision=${spec#*:}
            source_dir="/tmp/unblock-sources/$project"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "https://github.com/haxmeister/$project.git"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$revision"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
            echo "$project $revision"
          done
          sudo cpanm --notest --quiet /tmp/unblock-sources/perl-Net-QUIC
          sudo cpanm --notest --quiet /tmp/unblock-sources/perl-Unblock-HTTP1
          sudo cpanm --notest --quiet /tmp/unblock-sources/perl-Unblock-HTTP2
          sudo cpanm --notest --quiet /tmp/unblock-sources/perl-Unblock-HTTP3
      - name: Build and run distribution tests
        run: |
          perl Makefile.PL
          make
          make test
      - name: Test live TCP and QUIC sockets using Linux::Event
        run: |
          prove -v -b xt/linux-event-tcp.t xt/linux-event-quic.t xt/linux-event-streaming.t xt/linux-event-slow-reader.t xt/linux-event-producer-backpressure.t xt/linux-event-hard-output-limit.t xt/linux-event-pool-fairness.t xt/linux-event-quic-producer.t xt/linux-event-quic-reader-credit.t xt/linux-event-quic-multi-credit.t xt/linux-event-quic-join-cancel.t
          UNBLOCK_H3_MULTI_SEND_LIMIT=131072 prove -v -b xt/linux-event-quic-multi-credit.t
          UNBLOCK_H3_MULTI_SEND_LIMIT=4194304 prove -v -b xt/linux-event-quic-multi-credit.t
      - name: Direct versus shared Client benchmark smoke (not a performance gate)
        run: |
          perl -Iblib/lib -Iblib/arch bench/client-vs-direct.pl 1000 100 3
          perl -Iblib/lib -Iblib/arch bench/request-setup.pl 3000 3
          perl -Iblib/lib -Iblib/arch bench/h3-client-vs-direct.pl 30 8 1
          perl -Iblib/lib -Iblib/arch bench/h3-workload-profile.pl 100 20 3 4 16384
          perl -Iblib/lib -Iblib/arch bench/h3-workload-profile.pl 30 10 3 2 262144
